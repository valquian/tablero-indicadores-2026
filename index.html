<style>
  :root { --bg: #11131c; --panel: #181a26; --borde: #2b2e3d; --texto: #e9e9ed; --suave: #9397ab; --tenue: #595d6c; --acento: #9184d9; --acento-fuerte: #796cbf; --error: #d6455c; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: radial-gradient(120% 90% at 15% 0%, #1e2133 0%, var(--bg) 60%); color: var(--texto);
    font: 15px/1.55 Inter, "Segoe UI", system-ui, sans-serif; display: grid; place-items: center; padding: 24px 16px; }
  main { width: 100%; max-width: 420px; }
  .marca { font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--acento); }
  h1 { font-size: 28px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.2; margin-top: 10px; }
  .sub { color: var(--suave); font-size: 14px; margin-top: 10px; }
  form { margin-top: 30px; padding: 24px; border: 1px solid var(--borde); border-radius: 14px; background: color-mix(in srgb, var(--panel) 85%, transparent); }
  label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--suave); margin-bottom: 8px; }
  input { width: 100%; font: inherit; color: var(--texto); background: #0f111a; border: 1px solid var(--borde); border-radius: 9px; padding: 11px 13px; outline: none; transition: border-color 0.18s; }
  input:focus { border-color: var(--acento-fuerte); }
  button { width: 100%; margin-top: 14px; font: 600 14px/1 Inter, "Segoe UI", system-ui, sans-serif; color: #f3f5fe; background: color-mix(in srgb, var(--acento) 28%, transparent);
    border: 1px solid var(--acento-fuerte); border-radius: 9px; padding: 12px; cursor: pointer; transition: background-color 0.18s; }
  button:hover { background: color-mix(in srgb, var(--acento) 38%, transparent); }
  button:disabled { cursor: progress; opacity: 0.7; }
  .aviso { min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--error); }
  footer { margin-top: 22px; font-size: 12px; color: var(--tenue); }
</style>

<script>
(function () {
  var C = JSON.parse(document.getElementById('carga').textContent);
  var bytes = function (b64) { var s = atob(b64), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
  var form = document.getElementById('acceso'), campo = document.getElementById('clave'), boton = document.getElementById('abrir'), aviso = document.getElementById('aviso');
  // una vez por equipo (v1.1.0): el equipo guarda la llave derivada como CryptoKey no exportable en IndexedDB, nunca la contraseña.
  // El nombre de la base es propio de este tablero: el Tablero PAI publica en el mismo origen (valquian.github.io).
  var DB = 'tablero-indicadores';
  function idb(modo, fn) {
    return new Promise(function (ok, mal) {
      var q = indexedDB.open(DB, 1);
      q.onupgradeneeded = function () { q.result.createObjectStore('llaves'); };
      q.onsuccess = function () {
        var db = q.result, tx = db.transaction('llaves', modo), r = fn(tx.objectStore('llaves'));
        // cada conexión se cierra al terminar: una abierta bloquearía «Olvidar este equipo» hasta recargar
        tx.oncomplete = function () { db.close(); ok(r && r.result); };
        tx.onerror = tx.onabort = function () { db.close(); mal(tx.error); };
      };
      q.onerror = function () { mal(q.error); };
    });
  }
  async function descifrar(llave) {
    var plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(C.iv) }, llave, bytes(C.dato));
    var html = await new Response(new Blob([plano]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  }
  async function abrir(clave) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
    var llave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(C.sal), iterations: C.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(C.iv) }, llave, bytes(C.dato)); // valida antes de guardar
    try { await idb('readwrite', function (s) { return s.put(llave, 'llave'); }); } catch (e) {}
    await descifrar(llave);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    aviso.textContent = ''; boton.disabled = true; boton.textContent = 'Abriendo…';
    abrir(campo.value).catch(function () {
      boton.disabled = false; boton.textContent = 'Abrir tablero';
      aviso.textContent = 'Contraseña incorrecta.'; campo.select();
    });
  });

  // si este equipo ya abrió el tablero, la llave está guardada y abre sin pedir la contraseña;
  // si ya no descifra (la contraseña cambió), se borra y se pide de nuevo
  try { sessionStorage.removeItem('tablero-indicadores-clave'); } catch (e) {} // hasta v1.0.7 la contraseña quedaba aquí
  idb('readonly', function (s) { return s.get('llave'); }).then(function (llave) {
    if (!llave) return;
    boton.disabled = true; boton.textContent = 'Abriendo…';
    return descifrar(llave).catch(function () {
      return idb('readwrite', function (s) { return s.delete('llave'); }).then(function () { boton.disabled = false; boton.textContent = 'Abrir tablero'; });
    });
  }).catch(function () {});
})();
</script>
